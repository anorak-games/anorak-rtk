name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.42.0-anorak.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        # Note: we deliberately do NOT pass RTK_TELEMETRY_URL or
        # RTK_TELEMETRY_TOKEN at build time. The network code path was
        # removed from src/, but keeping these unset is belt-and-suspenders.
        run: cargo build --release --target ${{ matrix.target }}

      # --- Network egress assertions: fail the release if anything regresses. ---

      - name: Assert no network HTTP-client deps in source
        run: |
          if grep -rEn "^[[:space:]]*(use[[:space:]]+)?(reqwest|ureq|surf|hyper(_rustls)?)\b" src/; then
            echo "::error::Network HTTP-client crate found in src/. anorak-rtk must remain network-free."
            exit 1
          fi
          if grep -rEn '^[[:space:]]*ureq[[:space:]]*=' Cargo.toml; then
            echo "::error::ureq dep listed in Cargo.toml. Remove it."
            exit 1
          fi

      - name: Assert no http(s) URLs baked into binary strings (unix)
        if: runner.os != 'Windows'
        run: |
          BIN="target/${{ matrix.target }}/release/anorak-rtk"
          # Allowlist: github repo URL is fine in clap version strings, but
          # actual API/telemetry endpoints would surface as their own URLs.
          if strings "$BIN" | grep -E "^https?://" | grep -vE "github\.com/anorak-games/anorak-rtk"; then
            echo "::error::Disallowed http(s):// URL found in compiled binary."
            exit 1
          fi

      - name: Package
        run: |
          ARCHIVE="anorak-rtk-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar -czf "../../../$ARCHIVE" anorak-rtk
          cd ../../..
          shasum -a 256 "$ARCHIVE" | awk '{print $1"  "$2}' > "$ARCHIVE.sha256"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anorak-rtk-${{ matrix.target }}
          path: |
            anorak-rtk-${{ matrix.target }}.tar.gz
            anorak-rtk-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            Anorak hardened build of rtk. Network egress is removed at build time (no `ureq`/`reqwest`/etc. in the binary). See `UPSTREAM.md` for provenance.

            **Artifacts** (each with a `.sha256` sidecar):
            - `anorak-rtk-aarch64-apple-darwin.tar.gz`
            - `anorak-rtk-x86_64-apple-darwin.tar.gz`
            - `anorak-rtk-x86_64-unknown-linux-musl.tar.gz`

            Install via `scripts/bootstrap-rtk.sh` in anorak-os / anorak-ai-platform.
          files: release/*
          fail_on_unmatched_files: true
